name: build-docs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'composer.json'
      - 'package.json'
      - 'package-lock.json'
      - 'build-docs.php'
      - 'md/**'
      - 'resources/docs/**'
      - '.github/workflows/build-docs.yml'

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_EDIT_BRANCH: main
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://mrpunyapal.github.io/laravel-auditor' }}
      DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || '/laravel-auditor/' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build docs site
        run: composer run docs:build

      - name: Detect generated docs changes
        id: docs_changes
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit regenerated docs
        if: steps.docs_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "wip"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
