name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5, 8.6]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          - laravel: 12.*
            php: 8.6
          - laravel: 13.*
            php: 8.3

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Use Pest 4 for Laravel 12
        if: matrix.laravel == '12.*'
        run: composer require "pestphp/pest:^4.6" "pestphp/pest-plugin-laravel:^4.1" "pestphp/pest-plugin-type-coverage:^4.0.6" --no-interaction --no-update

      - name: Use Pest 5 for Laravel 13
        if: matrix.laravel == '13.*'
        run: composer require "pestphp/pest:^5.0" "pestphp/pest-plugin-laravel:^5.0" "pestphp/pest-plugin-type-coverage:^5.1.1" --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        env:
          FORK_MEM_PER_PROC: '999999999999'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        # Pest 5.3.5 / Paratest currently crashes while discovering tests in parallel.
        # Run the same full suite serially until the upstream runner is fixed.
        run: vendor/bin/pest

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest
